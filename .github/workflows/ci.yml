name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install .
      - name: Run tests
        run: python tests/test_credwatch.py -v
      - name: CLI smoke test
        run: |
          credwatch --help
          credwatch preflight --for 1h || true
          echo '{}' | credwatch statusline
