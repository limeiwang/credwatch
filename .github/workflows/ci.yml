name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install .
      - name: Run tests
        run: python tests/test_credwatch.py -v
      - name: CLI smoke test
        run: |
          credwatch --help
          credwatch preflight --for 1h || true
          echo '{}' | credwatch statusline

  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: One-liner exactly as users paste it (downloads from main)
        shell: powershell
        run: |
          irm https://raw.githubusercontent.com/limeiwang/credwatch/main/install.ps1 -OutFile $env:TEMP\credwatch-install.ps1; powershell -NoProfile -ExecutionPolicy Bypass -File $env:TEMP\credwatch-install.ps1
          if ($LASTEXITCODE -ne 0) { throw "one-liner failed" }
      - name: Run installer from file (re-run must be safe)
        shell: powershell
        run: |
          ./install.ps1
          $env:Path = [Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [Environment]::GetEnvironmentVariable("Path","User")
          $cw = (Get-Command credwatch -ErrorAction Stop).Source
          & $cw --version
          & $cw doctor; if ($LASTEXITCODE -gt 1) { throw "doctor crashed" }
          '{}' | & $cw statusline
          & $cw status --json | Out-Null; if ($LASTEXITCODE -gt 2) { throw "status failed" }
          if (-not (Test-Path "$env:USERPROFILE\.claude\settings.json")) { throw "statusline not configured" }
          schtasks /query /tn credwatch
          if ($LASTEXITCODE -ne 0) { throw "scheduled task missing" }
